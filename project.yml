name: DockTape
options:
  bundleIdPrefix: design.highgain
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

packages:
  DockTape:
    path: .

targets:
  DockTape:
    type: application
    platform: macOS
    sources:
      - path: Sources/DockTape
    resources:
      - path: Sources/DockTape/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.highgain.docktape
        PRODUCT_NAME: DockTape
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "3"
        INFOPLIST_KEY_CFBundleDisplayName: DockTape
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: UX8BPNLPX5
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: DockTape
        product: HiDockKit
      - package: DockTape
        product: HiDockKitUSB
    entitlements:
      path: Sources/DockTape/Resources/DockTape.entitlements
      properties:
        com.apple.security.device.usb: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.design.highgain.docktape
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.design.highgain.docktape
