name: DockTape
options:
  bundleIdPrefix: design.highgain
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

packages:
  DockTape:
    path: .

targets:
  DockTape:
    type: application
    platform: macOS
    sources:
      - path: Sources/DockTape
    resources:
      - path: Sources/DockTape/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: design.highgain.docktape
        PRODUCT_NAME: DockTape
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: DockTape
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: DockTape
        product: HiDockKit
    entitlements:
      path: Sources/DockTape/Resources/DockTape.entitlements
